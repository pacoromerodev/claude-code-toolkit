schema_version: "1.0"
name: skill-or-subagent
description: >-
  A long noisy investigation proposed as a skill. The answer must separate the skill from the subagent.
tags: [write-a-skill, skill]
execution:
  prompt: |
    I want a skill that reads through our whole test suite, works out which
    tests are slowest and why, and comes back with a list. It'll need to open
    a lot of files. Can a skill do that?
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
