schema_version: "1.0"
name: description-rewrite
description: >-
  A skill body with a weak description: the rewrite must put the trigger in
  user language and say what each candidate would and would not match.
tags: [skill-describer, subagent]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    This skill never fires. Can you fix the description?
  max_turns: 14
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Task, Skill]
runs: 3
