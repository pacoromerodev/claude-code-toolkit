schema_version: "1.0"
name: subagent-rambles
description: >-
  A subagent that returns unbounded prose. The diagnosis must be the missing
  output format, not the model.
tags: [audit-skills, skill, needs-bash]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    My review subagent rambles. It takes ages, comes back with four
    paragraphs of general thoughts, and I can never tell whether it actually
    looked at anything. It's in .claude/agents. Is this just how they are?
  max_turns: 14
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
runs: 3
