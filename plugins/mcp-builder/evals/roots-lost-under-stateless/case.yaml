schema_version: "1.0"
name: roots-lost-under-stateless
description: >-
  A file server whose boundary check depends on list_roots, moved to stateless
  mode. The answer must connect the two.
tags: [mcp-roots-check, skill, needs-bash]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We put this server behind a load balancer last week and since then
    read_file throws for everyone. Nothing else changed. What is going on?
  max_turns: 14
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
runs: 3
