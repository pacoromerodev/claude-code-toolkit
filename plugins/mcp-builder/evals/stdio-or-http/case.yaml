schema_version: "1.0"
name: stdio-or-http
description: >-
  Thirty users taken as a reason for HTTP. The answer must say what actually decides it.
tags: [choose-transport, skill]
execution:
  prompt: |
    Writing an MCP server that reads our internal wiki. It'll be used by
    about 30 people. My instinct is to deploy it as an HTTP service from the
    start — is stdio just for toys?
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
