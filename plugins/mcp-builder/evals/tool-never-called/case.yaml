schema_version: "1.0"
name: tool-never-called
description: >-
  A server whose tools are never chosen. The diagnosis must be the
  descriptions, and the fix must be the rewritten descriptions themselves.
tags: [mcp-review, subagent, needs-bash]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    I wired this MCP server into Claude and it basically never calls the
    tools — it just answers from memory. What's wrong with it?
  max_turns: 16
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Task, Skill]
runs: 3
