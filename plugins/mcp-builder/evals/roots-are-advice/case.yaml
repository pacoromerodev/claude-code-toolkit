schema_version: "1.0"
name: roots-are-advice
description: >-
  A server that reads roots and enforces nothing. The answer must say it is not a boundary.
tags: [mcp-roots-check, skill]
execution:
  prompt: |
    Our MCP server calls `await ctx.session.list_roots()` at startup and logs
    the directories. The tools take a path parameter. Security asked whether
    the server can read outside the project — it can't, right? The client
    told us the roots.
  max_turns: 12
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
