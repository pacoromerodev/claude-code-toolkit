schema_version: "1.0"
name: migration-unsafe
description: >-
  A migration that drops a column still read by the running code. The review
  must name the rolling-deploy failure and give the expand/contract split.
tags: [migration-review, subagent]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    I added this migration for tomorrow's release. Is it safe to deploy?
  max_turns: 18
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Task, Skill]
runs: 1
