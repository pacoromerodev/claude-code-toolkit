schema_version: "1.0"
name: transaction-boundary
description: >-
  Where @Transactional belongs. The answer must be the service, with the reason.
tags: [spring-boot-service, skill]
execution:
  prompt: |
    Where should @Transactional go — the controller, the service, or the
    repository? Our team has it on the repository interfaces right now and
    someone wants to move it to the controllers so everything is covered.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
