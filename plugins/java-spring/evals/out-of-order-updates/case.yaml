schema_version: "1.0"
name: out-of-order-updates
description: >-
  Status updates applied out of order, with more consumer threads proposed.
  The answer must reach partitioning by key.
tags: [kafka-consumer, skill]
execution:
  prompt: |
    Order status updates sometimes land out of order — an order shows
    "shipped" and then flips back to "packed". We publish every status change
    to one topic with a random key so the load spreads evenly, and we run
    eight consumer threads. Throughput is fine. Do we need a sequence number
    in the payload and reordering logic on our side?
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
