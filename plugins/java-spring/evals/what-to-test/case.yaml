schema_version: "1.0"
name: what-to-test
description: >-
  A discount rule and a proposed @SpringBootTest. The answer must pick the level and say why.
tags: [test-shape, skill]
execution:
  prompt: |
    I added a Spring service method that reads two entities, applies a
    discount rule, and saves the result. Should I write a @SpringBootTest for
    it, and should I mock the repository?
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
