schema_version: "1.0"
name: kafka-redelivery
description: >-
  A consumer with auto-commit and a non-idempotent handler. The review must
  start from at-least-once delivery, not from style.
tags: [kafka-consumer, skill, needs-bash]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Some customers are being charged twice and I can't reproduce it. This is
    the consumer — can you see anything wrong?
  max_turns: 16
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
runs: 3
