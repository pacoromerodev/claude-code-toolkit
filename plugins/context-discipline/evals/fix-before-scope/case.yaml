schema_version: "1.0"
name: fix-before-scope
description: >-
  A vague bug report with a subsystem-wide fix requested. The answer must get evidence before code.
tags: [scope-task, skill]
execution:
  prompt: |
    Payments are failing for some customers since Tuesday. Go through the
    payment code and fix whatever is causing it.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
