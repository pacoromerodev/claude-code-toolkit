schema_version: "1.0"
name: claude-md-rewrite
description: >-
  A CLAUDE.md full of unfollowable rules. The review must rewrite them into
  checkable ones, not merely list what is wrong.
tags: [claude-md-doctor, skill]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Claude keeps ignoring half of what's in my CLAUDE.md. Can you take a look?
  max_turns: 16
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
runs: 1
