name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read is all any of this needs. Stated rather than inherited, so widening it
# is a visible change to this file.
permissions:
  contents: read

# On a pull request, a new push makes the older run's answer irrelevant, so
# runs share a group per branch and the older one is cancelled. Everywhere
# else each commit gets a group of its own and is never cancelled: three
# merges that landed together started out of order, and the oldest one's run
# cancelled the newest, leaving the head of main with no result at all. A
# shared group without cancel-in-progress is not enough — a newer pending run
# still replaces an older pending one.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:
    name: Manifests and consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.282

      - name: Validate the marketplace manifest
        run: claude plugin validate .

      - name: Validate every plugin manifest
        run: |
          status=0
          for dir in plugins/*/; do
            echo "::group::${dir}"
            claude plugin validate "${dir}" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Every plugin has a marketplace entry, with matching versions
        run: python3 .github/scripts/check_consistency.py

      - name: Changelogs match their manifests
        run: python3 .github/scripts/check_changelogs.py

      - name: Hooks point at scripts that exist
        run: python3 .github/scripts/check_hooks.py

      - name: No two components answer to one name
        run: python3 .github/scripts/check_names.py

      - name: Workflows are scoped, pinned and free of interpolated shell
        run: python3 .github/scripts/check_workflows.py

      - name: No sentence is a sentence from the course notes
        run: python3 .github/scripts/check_course_wording.py --enforce

      - name: Every skill has the cases CONTRIBUTING asks for
        run: python3 .github/scripts/check_eval_coverage.py --enforce

      # Report-only on purpose: the runs are manual and cost money, so a red
      # build here would teach people to ignore red builds. What it buys is
      # that an unmeasured case is visible on every pull request instead of
      # drifting quietly, which is how the first suite decayed.
      - name: Which eval cases have no current measurement
        run: python3 .github/scripts/check_eval_freshness.py

      - name: Eval cases are runnable and graded both ways
        run: python3 .github/scripts/check_eval_cases.py

      # The auditor this repository ships, turned on the skills it ships.
      - name: Skills pass our own auditor
        run: python3 plugins/skill-forge/scripts/audit_skills.py plugins/*/skills

      # This repository's own CLAUDE.md, held to the checker it ships.
      - name: CLAUDE.md follows its own advice
        run: python3 plugins/context-discipline/scripts/check_claude_md.py CLAUDE.md

      # Not a hook, so it may use a dependency; the schema itself is vendored.
      - name: Settings files match the published schema
        run: |
          python3 -m pip install --quiet jsonschema
          python3 .github/scripts/validate_settings_schema.py

      - name: The CI scripts pass their own fixtures
        run: bash .github/scripts/tests/run.sh

      - name: The local eval runner skips what it cannot run, and says so
        run: bash scripts/tests/run-evals.test.sh

      # The route check itself needs a logged-in CLI and costs a session per
      # prompt, so CI runs it against a stub: what is tested here is that it
      # reads a transcript correctly and fails on a mis-route.
      - name: The route check reads a transcript correctly
        run: bash scripts/tests/route-check.test.sh

  hooks:
    name: Hook scripts
    # Pinned, not latest: 3.8 has no build for Ubuntu 26.04, so the day the
    # latest image moves is the day the floor stops being tested. The floor
    # itself lives in check_stdlib_only.py, which fails if this matrix and it
    # disagree.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Scripts compile
        run: python3 -m compileall -q plugins/*/scripts/

      - name: Scripts use only the standard library
        run: python3 .github/scripts/check_stdlib_only.py

      - name: Fixture tests
        run: |
          status=0
          for runner in plugins/*/tests/run.sh; do
            [ -f "$runner" ] || continue
            echo "::group::${runner}"
            bash "$runner" || status=1
            echo "::endgroup::"
          done
          exit $status

      # The step above runs in a checkout that compileall has already written
      # into, so it cannot see stray files. Run the suites again in a fresh
      # worktree and require it to stay clean, ignored files included.
      - name: Fixture tests leave no files behind
        run: |
          clean="$(mktemp -d)/wt"
          git worktree add --quiet --detach "$clean" HEAD
          cd "$clean"
          for runner in plugins/*/tests/run.sh; do
            bash "$runner" > /dev/null || exit 1
          done
          leftovers="$(git status --porcelain --ignored)"
          if [ -n "$leftovers" ]; then
            echo "::error::the fixture tests wrote into the repository:"
            echo "$leftovers"
            exit 1
          fi

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find plugins .github scripts -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning
