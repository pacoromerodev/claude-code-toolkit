name: evals

# Eval runs cost money and need a credential, so they are not part of the
# pull-request gate. Trigger them by hand before a release, or let the weekly
# run catch drift in how the model responds to the same prompts.
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: One plugin name, or empty for all of them
        required: false
        default: ""
      threshold:
        description: Fail below this score (0..1)
        required: false
        default: "0.8"
      runs:
        description: Runs per case (the weekly run uses 1)
        required: false
        default: "1"
      max_cost_usd:
        description: Hard ceiling per plugin, in USD
        required: false
        default: "5"
  schedule:
    - cron: "0 6 * * 1"

# Nothing here needs to write to the repository, and the eval sandbox runs
# model-written commands: a token in the checkout would be inside it.
permissions:
  contents: read

jobs:
  plan:
    name: Which plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.pick.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: pick
        env:
          ONLY: ${{ inputs.plugin }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, sys
          only = (os.environ.get("ONLY") or "").strip().strip("/")
          only = only[len("plugins/"):] if only.startswith("plugins/") else only
          names = sorted(p.name for p in pathlib.Path("plugins").iterdir() if p.is_dir())
          if only:
              if only not in names:
                  print(f"::error::no plugin called {only!r}", file=sys.stderr)
                  raise SystemExit(1)
              names = [only]
          print("plugins=" + json.dumps(names))
          PY

  eval:
    name: ${{ matrix.plugin }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plan.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scaffolds such as delivery-quality/evals/verify-fires build a pytest
      # project, and the graders expect the suite to be run. Without pytest
      # those cases can only fail.
      - name: Install what the scaffolds need
        run: python3 -m pip install --quiet pytest

      # `plugin eval` refuses a Bash-granting run it cannot confine, rather
      # than running it unconfined. A bare runner has neither tool, so every
      # case tagged needs-bash fails before it starts.
      - name: Install the sandbox the eval requires
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          bwrap --version && socat -V | head -1

      # Pinned: an eval measures the plugin, so the thing measuring it should
      # not change between runs without someone deciding it should.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.278

      # Either credential works, and they bill differently. A subscription
      # token bills the plan that issued it and needs no credit balance; an
      # API key bills the workspace it belongs to, and a key with no workspace
      # fails every call with a 400. When both are present the token wins, so
      # a repository holding both does not spend credits by accident.
      - name: Run the eval suite
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLUGIN: ${{ matrix.plugin }}
          THRESHOLD: ${{ inputs.threshold || '0.8' }}
          RUNS: ${{ inputs.runs || '1' }}
          MAX_COST: ${{ inputs.max_cost_usd || '5' }}
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            unset ANTHROPIC_API_KEY
            echo "Authenticating with the subscription token."
          elif [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo "Authenticating with the API key; runs bill its workspace."
          else
            echo "::error::No credential. Add CLAUDE_CODE_OAUTH_TOKEN, from 'claude setup-token', or ANTHROPIC_API_KEY."
            exit 1
          fi
          claude plugin eval "plugins/${PLUGIN}" \
            --scaffold \
            --allow-tools Bash \
            --trust-plugin \
            --no-publish \
            --runs "${RUNS}" \
            --max-cost-usd "${MAX_COST}" \
            --threshold "${THRESHOLD}" \
            --json "eval-${PLUGIN}.json"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.plugin }}
          path: |
            eval-*.json
            plugins/*/evals/results/**
          if-no-files-found: warn
