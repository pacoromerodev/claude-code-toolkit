name: build
on: [push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install -g @acme/tool@1.2.3
      - name: Say the branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "on ${BRANCH}"
